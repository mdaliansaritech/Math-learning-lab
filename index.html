<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Learning Lab</title>
    <style>
        :root {
            --bg: #87CEEB;
            --card-bg: #FFFFFF;
            --primary: #FF6B6B;
            --text: #2D3436;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .controls {
            margin-bottom: 20px;
            height: 40px;
        }

        select {
            padding: 8px 15px;
            font-size: 1.1rem;
            border-radius: 10px;
            border: 2px solid var(--primary);
            font-family: inherit;
            color: var(--text);
            background: white;
            cursor: pointer;
            outline: none;
        }

        .problem-area {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0 40px 0;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .options-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #FFE66D;
            border: 4px solid #FFD166;
            border-radius: 15px;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text);
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #FFD166;
            min-width: 80px;
        }

        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #FFD166;
        }

        .blank-space {
            border-bottom: 6px solid var(--text);
            min-width: 60px;
            display: inline-block;
            color: var(--primary);
        }

        .success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            font-size: 6rem;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: all;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="controls" id="math-controls">
            <select id="operation-select" onchange="generateProblem()">
                <option value="mix">Mix All</option>
                <option value="add">Addition (+)</option>
                <option value="sub">Subtraction (-)</option>
                <option value="mul">Multiplication (×)</option>
                <option value="div">Division (÷)</option>
            </select>
        </div>

        <div id="game-content"></div>

        <div class="options-area" id="options"></div>

        <div class="success-overlay" id="success">
            ⭐<br>
            <span style="font-size: 2.5rem; color: #FF6B6B;">Great Job!</span>
        </div>
    </div>

    <script>
        let currentAnswer = null;

        function generateProblem() {
            const content = document.getElementById('game-content');
            const optionsArea = document.getElementById('options');
            optionsArea.innerHTML = '';

            let opChoice = document.getElementById('operation-select').value;
            const ops = ['add', 'sub', 'mul', 'div'];
            
            // If "Mix All" is selected, randomly pick one of the 4 operations
            if (opChoice === 'mix') {
                opChoice = ops[Math.floor(Math.random() * ops.length)];
            }

            let num1, num2, operator;

            if (opChoice === 'add') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                operator = '+';
                currentAnswer = num1 + num2;

            } else if (opChoice === 'sub') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                if (num2 > num1) [num1, num2] = [num2, num1]; // Swap to avoid negatives
                operator = '-';
                currentAnswer = num1 - num2;

            } else if (opChoice === 'mul') {
                // Keep numbers small for multiplication (1 to 5)
                num1 = Math.floor(Math.random() * 5) + 1;
                num2 = Math.floor(Math.random() * 5) + 1;
                operator = '×';
                currentAnswer = num1 * num2;

            } else if (opChoice === 'div') {
                // Generate two small numbers, multiply them to get a clean divisible numerator
                let ans = Math.floor(Math.random() * 5) + 1;
                let divisor = Math.floor(Math.random() * 5) + 1;
                num1 = ans * divisor; // Numerator
                num2 = divisor;       // Denominator
                operator = '÷';
                currentAnswer = ans;
            }

            content.innerHTML = `<div class="problem-area">${num1} ${operator} ${num2} = <span class="blank-space">?</span></div>`;

            // Generate 3 choices (1 correct, 2 wrong)
            let choices = [currentAnswer];
            
            // Ensure wrong answers are unique and positive
            while(choices.length < 3) {
                let offset = Math.floor(Math.random() * 5) + 1;
                let wrong = Math.random() > 0.5 ? currentAnswer + offset : currentAnswer - offset;
                if (wrong >= 0 && !choices.includes(wrong)) {
                    choices.push(wrong);
                }
            }

            choices = choices.sort(() => Math.random() - 0.5); // Shuffle

            choices.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = num;
                btn.onclick = () => checkAnswer(num);
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected === currentAnswer) {
                const success = document.getElementById('success');
                success.classList.add('show');
                
                setTimeout(() => {
                    success.classList.remove('show');
                    generateProblem();
                }, 1500);
            } else {
                const optionsArea = document.getElementById('options');
                optionsArea.style.transform = 'translateX(-10px)';
                setTimeout(() => optionsArea.style.transform = 'translateX(10px)', 100);
                setTimeout(() => optionsArea.style.transform = 'translateX(0)', 200);
            }
        }

        // Initialize the first problem
        generateProblem();
    </script>
</body>
</html>
