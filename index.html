<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Learning Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="header-area">
            <div class="streak-counter" id="streak-counter">🔥 Streak: 0</div>
            <select id="operation-select" onchange="generateProblem()">
                <option value="mix">Mix All</option>
                <option value="add">Addition (+)</option>
                <option value="sub">Subtraction (-)</option>
                <option value="mul">Multiplication (×)</option>
                <option value="div">Division (÷)</option>
            </select>
        </div>

        <div id="game-content"></div>

        <div class="options-area" id="options"></div>

        <div class="success-overlay" id="success">
            ⭐<br>
            <span style="font-size: 2.5rem; color: #FF6B6B;">Great Job!</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
